# Builds an unsigned iOS .ipa of the Melodify dev client on a macOS runner.
# Download the artifact, then sign and install it with SideStore.
#
# Trigger manually (workflow_dispatch) or on pushes that touch native config.

name: iOS unsigned build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode configuration
        type: choice
        options: [Debug, Release]
        default: Debug
  push:
    branches: [main]
    paths:
      - app.json
      - app.config.*
      - package.json
      - package-lock.json
      - modules/**
      - .github/workflows/ios-build.yml

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
      SCHEME: Melodify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'package-lock.json') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Build (no code signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "$SCHEME.xcworkspace" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | xcpretty || xcodebuild -version

      - name: Package .ipa
        working-directory: ios
        run: |
          APP=$(find build/Build/Products -name "*.app" -maxdepth 2 | head -1)
          test -n "$APP" || { echo "no .app produced"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "Melodify-$CONFIGURATION-unsigned.ipa" Payload
          ls -la *.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Melodify-${{ env.CONFIGURATION }}-unsigned
          path: ios/Melodify-${{ env.CONFIGURATION }}-unsigned.ipa
          retention-days: 14
