# Builds an unsigned iOS .ipa of the Melodify dev client on a macOS runner.
# Download the artifact, then sign and install it with SideStore.
#
# Trigger manually (workflow_dispatch) or on pushes that touch native config.

name: iOS unsigned build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode configuration
        type: choice
        options: [Debug, Release]
        default: Debug
  push:
    branches: [main]
    paths:
      - app.json
      - app.config.*
      - package.json
      - package-lock.json
      - modules/**
      - .github/workflows/ios-build.yml

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
      SCHEME: Melodify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Select Xcode
        # Expo SDK 57's ExpoModulesJSI headers do not compile with Xcode 26.3's Swift
        # (SWIFT_RETURNS_RETAINED on constructors is an error there). Pin the newest
        # version that works; bump XCODE_VERSION when upgrading Expo.
        env:
          XCODE_VERSION: "26.2"
        run: |
          ls -d /Applications/Xcode_*.app
          XCODE="/Applications/Xcode_${XCODE_VERSION}.app"
          test -d "$XCODE" || { echo "::error::$XCODE not on this runner"; exit 1; }
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcrun swift --version

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'package-lock.json') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Build (no code signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "$SCHEME.xcworkspace" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E --line-buffered \
              '^(=== |\*\* |error:|warning: .*deprecated|.*error: |The following build commands failed|\s+PhaseScriptExecution|\s+CompileSwift|\s+CompileC .*error)' || true
          # tee's pipeline hides xcodebuild's own status; check the log instead
          if grep -q '\*\* BUILD FAILED \*\*' xcodebuild.log; then
            echo "::error::xcodebuild failed. Last 200 lines of the raw log follow."
            tail -200 xcodebuild.log
            exit 1
          fi
          grep -q '\*\* BUILD SUCCEEDED \*\*' xcodebuild.log

      - name: Upload raw xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ env.CONFIGURATION }}
          path: ios/xcodebuild.log
          retention-days: 7

      - name: Package .ipa
        working-directory: ios
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "$SCHEME.app" | head -1)
          test -n "$APP" || { echo "::error::no $SCHEME.app produced"; exit 1; }
          test -x "$APP/$SCHEME" || { echo "::error::$APP has no executable"; ls -la "$APP"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "$SCHEME-$CONFIGURATION-unsigned.ipa" Payload
          ls -la *.ipa
          du -sh Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Melodify-${{ env.CONFIGURATION }}-unsigned
          path: ios/Melodify-${{ env.CONFIGURATION }}-unsigned.ipa
          retention-days: 14
